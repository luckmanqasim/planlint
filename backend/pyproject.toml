[project]
name = "planlint"
version = "0.1.0"
description = "PlanLint: spatio-semantic graph linking for AEC compliance verification"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[google,openai,anthropic]>=1.97",
    "neo4j>=5.25",
    "pymupdf>=1.24",
    "fastembed>=0.5",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docling = ["docling>=2.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "inline-snapshot>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planlint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Snapshots compare as plain values by default (no interactive fix prompts —
# critical for CI/agents). Update intentionally with: pytest --inline-snapshot=fix
addopts = "--inline-snapshot=disable"
markers = [
    "integration: requires a live Neo4j instance (docker compose up neo4j)",
]

[tool.inline-snapshot]
default-flags = ["report"]  # never prompt interactively (CI/agent safety)
